name: Build & Package Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript lint check
        run: npm run lint

      - name: Build companion web app
        run: npm run build

      - name: Build Chrome & Firefox extension packages
        run: npm run build:extension

      - name: Upload zip artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: cadence-extension-packages
          path: |
            CWS.zip
            Firefox.zip

      - name: Attach zips to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CWS.zip
            Firefox.zip
